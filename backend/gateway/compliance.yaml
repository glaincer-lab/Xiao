# ============================================================
# 出网安全网关 · 合规配置（M0 / A1）
# ============================================================
# 本文件是「出网安全网关」的唯一配置入口，所有出网文本在交给云端前
# 都会经过这里定义的拦截与混淆规则。字段名是跨任务契约（A2/A3/A4/A5
# 直接按这些名字读取），**不可改名，只可新增**。
#
# 修改后无需任何进一步配置：`load_compliance()` 会直接读本文件。
# 如果某一项需要关闭，直接把值改成下面注释里的默认引导即可，别删字段。
# ------------------------------------------------------------

compliance_gateway:
  # 总开关：false 时网关整体直通（不拦截不混淆），仅用于排障。
  enabled: true

  # 1. 绝对不出网的黑词表（硬拦截）。
  #    命中的整条文本一律留在本机（只做本机摘要或提示「仅本机存档」），
  #    零云调用。这里除了敏感信息类（身份证/密码/密钥/bank），
  #    还包含「自伤类」黑词——命中即本机处理并引导专业帮助，绝不出网。
  local_only_keywords:
    - "身份证"
    - "密码"
    - "密钥"
    - "bank"
    - "自杀"
    - "不想活了"

  # 2. 差序/敏感名词混淆映射（出网前替换，回程还原）。
  #    格式：{"原词": "占位符"}。例如 "我妈": "User_Kinship_Mother"。
  #    留空 {} 表示暂不替换；手工映射只护高频实体，长尾明文出网（个人自用豁免）。
  obfuscation_mapping: {}   # 示例: {"我妈": "User_Kinship_Mother", "张总": "User_Leader_Alpha"}

  # 3. 巩固摘要 Prompt 的 suggested_entities 最大条数（顺风车 NER 上限）。
  suggested_entities_max: 5

  # 4. 调试日志：true 时输出占位符还原校验明细；日常 false 关闭。
  debug_log: false
