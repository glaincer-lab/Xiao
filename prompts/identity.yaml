# ---- 留钩子：你上次说的 XX 后来怎么样了 ----
- id: hook_followup_01
  stance: friend
  emotion: any
  intimacy_range: [20, 100]
  skeleton: [回勾前文, 关心近况]
  template: "你上次说的那件事，后来怎么样了？我还记着。"
  ban_words: [正在为您记录, 已存入]
  variables: []

- id: hook_followup_02
